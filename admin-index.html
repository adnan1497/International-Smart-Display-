<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Product Admin</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Product Admin">
<meta name="theme-color" content="#2f5d50">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232f5d50'/%3E%3Ctext x='50' y='64' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif'%3EP%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232f5d50'/%3E%3Ctext x='50' y='64' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif'%3EP%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1c1a17;
    --paper:#faf7f2;
    --card:#ffffff;
    --line:#e7e0d5;
    --accent:#2f5d50;
    --accent-dim:#e5efec;
    --danger:#a83a2f;
    --muted:#8a8177;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .topbar{
    position:sticky; top:0; z-index:10;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{
    font-size:15px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--accent);
  }
  .brand span{color:var(--ink); font-weight:400; text-transform:none; letter-spacing:0; margin-inline-start:6px;}
  .count-pill{
    font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:4px 10px;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:16px; padding-bottom:100px;}

  .lock{
    min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column;
    padding:24px; text-align:center;
  }
  .lock h1{ font-size:20px; margin-bottom:4px;}
  .lock p{ color:var(--muted); font-size:14px; margin-top:0; margin-bottom:24px;}
  .lock input{
    width:100%; max-width:280px; padding:14px 16px; border-radius:12px; border:1px solid var(--line);
    font-size:16px; text-align:center; letter-spacing:.1em; background:var(--card);
  }
  .lock button{ margin-top:14px; }

  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:12px;
    padding:13px 18px; font-size:15px; font-weight:600;
  }
  .btn-primary{ background:var(--accent); color:#fff; width:100%; max-width:280px;}
  .btn-primary:active{ opacity:.85; }
  .btn-ghost{ background:transparent; color:var(--muted); font-weight:500; font-size:13px; padding:8px 10px;}

  .empty{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty .glyph{ font-size:34px; margin-bottom:10px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px; margin-bottom:12px; display:flex; gap:12px; align-items:flex-start;
  }
  .thumb{ width:64px; height:64px; border-radius:10px; object-fit:cover; background:var(--accent-dim); flex-shrink:0; }
  .thumb.placeholder{ display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px;}
  .card-body{ flex:1; min-width:0; }
  .card-title{ font-weight:700; font-size:15px; margin-bottom:2px; }
  .card-desc{ font-size:12.5px; color:var(--muted); margin-bottom:6px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .price-row{ display:flex; align-items:baseline; gap:8px; }
  .price-now{ font-weight:700; color:var(--accent); font-size:15px;}
  .price-old{ text-decoration:line-through; color:var(--muted); font-size:12.5px;}
  .card-actions{ display:flex; gap:6px; margin-top:8px; }
  .icon-btn{ background:var(--accent-dim); color:var(--accent); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600;}
  .icon-btn.del{ background:#f6e6e3; color:var(--danger); }

  .fab{
    position:fixed; bottom:calc(22px + env(safe-area-inset-bottom)); right:50%; transform:translateX(320px);
    background:var(--accent); color:#fff; width:56px; height:56px; border-radius:50%;
    font-size:26px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(47,93,80,.35); z-index:20;
  }
  @media (max-width:680px){ .fab{ transform:none; right:20px; } }

  .overlay{
    position:fixed; inset:0; background:rgba(28,26,23,.45); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--paper); width:100%; max-width:640px; border-radius:20px 20px 0 0;
    max-height:92vh; overflow-y:auto; padding:20px 18px 28px;
  }
  .sheet h2{ font-size:18px; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .field input, .field textarea{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    font-size:15px; font-family:inherit; background:var(--card);
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .img-preview{
    width:100%; height:150px; border-radius:12px; border:1px dashed var(--line);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; overflow:hidden; margin-bottom:10px; position:relative;
  }
  .img-preview img{ width:100%; height:100%; object-fit:cover; }
  .sheet-actions{ display:flex; gap:10px; margin-top:18px; }
  .sheet-actions button{ flex:1; }
  .btn-cancel{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .msg{ font-size:13px; text-align:center; margin-top:10px; min-height:16px; }
  .msg.err{ color:var(--danger); }
  .msg.ok{ color:var(--accent); }
  .spinner{
    display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-3px; margin-inline-end:6px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .hidden{ display:none !important; }
  .install-tip{
    max-width:300px; font-size:12px; color:var(--muted); margin-top:20px; line-height:1.5;
    border-top:1px solid var(--line); padding-top:16px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand">Admin<span>Product List</span></div>
    <div class="count-pill" id="countPill">0 products</div>
  </div>
  <div class="wrap">
    <div id="listArea"></div>
  </div>
  <div class="fab" onclick="openForm()">+</div>
</div>

<script>
const SUPABASE_URL = "https://zlknqthxjimngofrlxvd.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa25xdGh4amltbmdvZnJseHZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NjUyODgsImV4cCI6MjEwMDI0MTI4OH0.t1TdTcH7xYlcYMufKHwfIKoLe0BBsfRDuIWk5Z7MRJ8";
const BUCKET = "Products";
const PASSCODE = "1234";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];
let editingId = null;
let pendingFile = null;
loadProducts();

async function loadProducts(){
  const listArea = document.getElementById('listArea');
  listArea.innerHTML = `<div class="empty">Loading...</div>`;
  const { data, error } = await sb.from('products').select('*').order('id', {ascending:false});
  if(error){
    listArea.innerHTML = `<div class="empty">Could not load products<br><span style="font-size:12px">${error.message}</span></div>`;
    return;
  }
  products = data || [];
  document.getElementById('countPill').textContent = products.length + ' products';
  if(products.length === 0){
    listArea.innerHTML = `<div class="empty"><div class="glyph">🗂️</div>No products yet<br>Tap the + button below to add one</div>`;
    return;
  }
  const symbols = { BDT:'৳', USD:'$', EUR:'€', BRL:'R$', GBP:'£', INR:'₹', SAR:'﷼', AED:'د.إ' };
  const sym = c => symbols[c] || (c ? c + ' ' : '৳');
  listArea.innerHTML = products.map(p => `
    <div class="card">
      ${p.image_url
        ? `<img class="thumb" src="${p.image_url}">`
        : `<div class="thumb placeholder">No image</div>`}
      <div class="card-body">
        <div class="card-title">${escapeHtml(p.name || '')}</div>
        ${p.description ? `<div class="card-desc">${escapeHtml(p.description)}</div>` : ''}
        <div class="price-row">
          ${p.offer ? `<span class="price-now">${sym(p.currency)}${p.offer}</span><span class="price-old">${sym(p.currency)}${p.price}</span>`
                           : `<span class="price-now">${sym(p.currency)}${p.price ?? ''}</span>`}
        </div>
        <div class="card-actions">
          <div class="icon-btn" onclick="openForm('${p.id}')">Edit</div>
          <div class="icon-btn del" onclick="deleteProduct('${p.id}')">Delete</div>
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function deleteProduct(id){
  if(!confirm('Delete this product? This cannot be undone.')) return;
  const p = products.find(x => String(x.id) === String(id));
  const { error } = await sb.from('products').delete().eq('id', id);
  if(error){ alert('Could not delete: ' + error.message); return; }
  if(p && p.image_url){
    const path = p.image_url.split('/').pop();
    sb.storage.from(BUCKET).remove([path]).catch(()=>{});
  }
  loadProducts();
}

function openForm(id){
  editingId = id || null;
  pendingFile = null;
  const p = id ? products.find(x => String(x.id) === String(id)) : {};

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'formOverlay';
  overlay.innerHTML = `
    <div class="sheet">
      <h2>${id ? 'Edit Product' : 'Add New Product'}</h2>

      <div class="field">
        <label>Photo</label>
        <div class="img-preview" id="imgPreview" onclick="document.getElementById('imgFile').click()">
          ${p.image_url ? `<img src="${p.image_url}">` : 'Tap to choose a photo'}
        </div>
        <input type="file" id="imgFile" accept="image/*" class="hidden" onchange="onFileChosen(event)">
      </div>

      <div class="field">
        <label>Product name</label>
        <input id="f_name" type="text" value="${p.name ? escapeAttr(p.name) : ''}" placeholder="e.g. Silk Saree">
      </div>

      <div class="row2">
        <div class="field">
          <label>Price</label>
          <input id="f_price" type="number" inputmode="decimal" value="${p.price ?? ''}" placeholder="1200">
        </div>
        <div class="field">
          <label>Offer price</label>
          <input id="f_offer" type="number" inputmode="decimal" value="${p.offer ?? ''}" placeholder="Optional">
        </div>
      </div>

      <div class="field">
        <label>Currency</label>
        <select id="f_currency" style="width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); font-size:15px; font-family:inherit; background:var(--card);">
          <option value="BDT">৳ Taka (BDT)</option>
          <option value="USD">$ US Dollar (USD)</option>
          <option value="EUR">€ Euro (EUR)</option>
          <option value="GBP">£ Pound (GBP)</option>
          <option value="INR">₹ Rupee (INR)</option>
          <option value="BRL">R$ Real (BRL)</option>
          <option value="SAR">﷼ Saudi Riyal (SAR)</option>
          <option value="AED">د.إ UAE Dirham (AED)</option>
        </select>
      </div>

      <div class="field">
        <label>Description</label>
        <textarea id="f_desc" placeholder="Short description">${p.description ? escapeHtml(p.description) : ''}</textarea>
      </div>

      <div class="msg" id="formMsg"></div>

      <div class="sheet-actions">
        <button class="btn-cancel" onclick="closeForm()">Cancel</button>
        <button class="btn-primary" id="saveBtn" onclick="saveProduct()">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('f_currency').value = p.currency || 'BDT';
}

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function closeForm(){
  const el = document.getElementById('formOverlay');
  if(el) el.remove();
}

function onFileChosen(e){
  const file = e.target.files[0];
  if(!file) return;
  pendingFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('imgPreview').innerHTML = `<img src="${ev.target.result}">`;
  };
  reader.readAsDataURL(file);
}

async function saveProduct(){
  const name = document.getElementById('f_name').value.trim();
  const price = document.getElementById('f_price').value;
  const offer = document.getElementById('f_offer').value;
  const currency = document.getElementById('f_currency').value;
  const desc = document.getElementById('f_desc').value.trim();
  const msg = document.getElementById('formMsg');
  const saveBtn = document.getElementById('saveBtn');

  if(!name || !price){
    msg.className = 'msg err';
    msg.textContent = 'Name and price are required';
    return;
  }

  saveBtn.disabled = true;
  saveBtn.innerHTML = `<span class="spinner"></span>Saving...`;
  msg.className = 'msg';
  msg.textContent = '';

  try{
    let imageUrl = editingId ? (products.find(x=>String(x.id)===String(editingId))?.image_url || null) : null;

    if(pendingFile){
      const ext = pendingFile.name.split('.').pop();
      const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const { error: upErr } = await sb.storage.from(BUCKET).upload(path, pendingFile);
      if(upErr) throw upErr;
      const { data: pub } = sb.storage.from(BUCKET).getPublicUrl(path);
      imageUrl = pub.publicUrl;
    }

    const payload = {
      name,
      price: parseFloat(price),
      offer: offer ? parseFloat(offer) : null,
      currency,
      description: desc || null,
      image_url: imageUrl
    };

    let error;
    if(editingId){
      ({ error } = await sb.from('products').update(payload).eq('id', editingId));
    } else {
      ({ error } = await sb.from('products').insert(payload));
    }
    if(error) throw error;

    closeForm();
    loadProducts();
  } catch(err){
    msg.className = 'msg err';
    msg.textContent = 'Error: ' + err.message;
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
  }
}
</script>
</body>
</html>
